services:
  metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querypilot
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5433:5432"
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://querypilot:${POSTGRES_PASSWORD:-local_dev_only_change_me}@metadata-db:5432/querypilot}
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - querypilot_data:/app/data
    depends_on:
      metadata-db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  metadata_data:
  querypilot_data:
