# render.yaml — My Query AI: Render Blueprint
# Deploy with one click: https://render.com/deploy
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API (FastAPI + Python) ─────────────────────────────────────────
  - type: web
    name: my-query-ai-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    region: oregon
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: My Query AI API
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false   # Set in Render Dashboard → Environment
      - key: CORS_ORIGINS
        sync: false   # Set to your web service URL e.g. https://my-query-ai-web.onrender.com
      - key: DATA_DIR
        value: /app/data
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash-latest
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-beta
      - key: GROK_TIMEOUT_SECONDS
        value: "60"
      - key: QUERY_TIMEOUT_SECONDS
        value: "8"
      - key: QUERY_MAX_ROWS
        value: "500"
      - key: UPLOAD_MAX_MB
        value: "20"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "90"
    # Persistent disk (Optional: requires Render Starter plan or above; uncomment if using paid plan)
    # disk:
    #   name: querypilot-data
    #   mountPath: /app/data
    #   sizeGB: 1

  # ── Frontend Web (Next.js) ─────────────────────────────────────────────────
  - type: web
    name: my-query-ai-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    region: oregon
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false   # Set to: https://my-query-ai-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
        sync: false
